<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FitnessLab — Регистрация</title>
  <link rel="icon" type="image/png" href="Your paragraph text (1).png">
  <style>
    :root {
      --surface: rgba(12, 18, 34, 0.78);
      --surface-border: rgba(255, 255, 255, 0.18);
      --text-main: #eef2ff;
      --text-muted: #bbc7f5;
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.22);
      --input-focus: #8ca8ff;
      --accent-a: #ffd65a;
      --accent-b: #ffbc2c;
      --button-text: #111;
      --radius-lg: 22px;
      --radius-md: 14px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      --transition: 0.28s ease;
      font-family: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 166, 77, 0.18), transparent 40%),
        radial-gradient(circle at 86% 82%, rgba(112, 134, 255, 0.22), transparent 44%),
        url('https://static.posters.cz/image/1300/96980.jpg') center 35% / cover fixed no-repeat;
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
    }

    .auth-shell {
      width: min(100%, 500px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--surface-border);
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 32px 30px 28px;
      animation: rise 0.45s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand h1 {
      font-size: 23px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 22px;
      line-height: 1.45;
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field { margin-bottom: 14px; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #d5defd;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .field input::placeholder { color: #95a4da; }

    .field input:focus {
      outline: none;
      border-color: var(--input-focus);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 4px rgba(140, 168, 255, 0.2);
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      border: 0;
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--button-text);
      background: linear-gradient(145deg, var(--accent-a), var(--accent-b));
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
      box-shadow: 0 10px 20px rgba(255, 188, 44, 0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 14px 26px rgba(255, 188, 44, 0.42);
    }

    .footer-links {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .link {
      color: #dde5ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.9;
      transition: opacity var(--transition), transform var(--transition);
    }

    .link:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    @media (max-width: 560px) {
      .auth-shell { padding: 26px 20px 22px; }
      .brand h1 { font-size: 20px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand">
      <img src="Your paragraph text (1).png" alt="FitnessLab Logo">
      <h1>FitnessLab<br>Регистрация</h1>
    </div>
    <p class="subtitle">Създай профил и отключи всички страници и функции.</p>

    <form id="signup-form">
      <div class="form-grid">
        <div class="field full">
          <label for="signup-name">Пълно име</label>
          <input type="text" id="signup-name" placeholder="Име и фамилия" required>
        </div>
        <div class="field full">
          <label for="signup-email">Имейл</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="signup-pass">Парола</label>
          <input type="password" id="signup-pass" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label for="signup-confirm">Потвърдете паролата</label>
          <input type="password" id="signup-confirm" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn">Създай акаунт</button>
    </form>

    <div class="footer-links">
      <a href="log-in.html" class="link">Вече имате акаунт? Вход</a>
      <a href="index.html" class="link">Към началната страница</a>
    </div>
  </main>

  <script src="auth-db.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async e => {
      e.preventDefault();

      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-pass').value;
      const confirmPassword = document.getElementById('signup-confirm').value;

      if (password !== confirmPassword) {
        alert('Паролите не съвпадат.');
        return;
      }

      try {
        await createUser({ name, email, password });
        localStorage.setItem('userName', name);
        localStorage.setItem('isLoggedIn', 'true');

        alert(`Регистрацията е успешна! Здравей, ${name}!`);
        window.location.href = 'index.html';
      } catch (error) {
        console.error(error);
        alert(error.message || 'Възникна грешка при регистрация.');
      }
    });
  </script>
  <script src="site-language.js"></script>
</body>
</html>
